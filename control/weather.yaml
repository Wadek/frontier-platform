# Weather — fleet pricing policy (editable without code).
# Official source: https://api-docs.deepseek.com/quick_start/pricing
# Verified 2026-09-14 (both at planning time and at go-time).

window:
  # Peak: Monday-Friday 01:00-04:00 and 06:00-10:00 UTC. All else off-peak
  # (including weekends). Off-peak rates are half of peak.
  peak_hours_utc:
    - [1, 4]
    - [6, 10]
  weekdays_only: true

rates_per_1m_usd:
  deepseek-flash:
    input_cache_miss: {peak: 0.30, off_peak: 0.15}
    output:           {peak: 1.20, off_peak: 0.60}
    vision: true
  deepseek-v4-pro:
    input_cache_miss: {peak: 1.32, off_peak: 0.66}
    output:           {peak: 3.96, off_peak: 1.98}
    vision: false

rules:
  - pro runway never at peak; review -> holding, job service reschedules off-peak
  - daily one-shot check of the pricing page; alert on change
  - local first: the local GPU flies before any cloud runway
  - all cloud calls egress-filtered first; refused trees never cross
  - spend ledgers per plane (tokens + USD) feed the data index
