# Runways — harness adapters. Same workflow, any runway.
# A runway is a command template + cost class + context injection.

runways:
  - id: waka-cli
    kind: local
    cost_class: free
    command: >
      waka-cli -p "{prompt}" --cwd {cwd} --docs {brief} --always-approve
    inject:
      - .agent_{plane}/brief.md
      - .agent_{plane}/knowledge/mappings.md
    notes: Ollama qwen2.5-coder:64k on RTX 2080 8GB; 0 tokens; prefer for atomic work.

  - id: deepseek-flash
    kind: cloud
    cost_class: cheap
    model: deepseek-flash
    base_url: https://api.deepseek.com
    notes: Anytime after egress; supports Vision; coach/tips/draft work.

  - id: deepseek-v4-pro
    kind: cloud
    cost_class: expensive
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    off_peak_only: true
    notes: Teacher pass, census-deep, verify. Grounded at peak (weather.yaml).

  - id: dsh
    kind: harness
    cost_class: variable
    notes: DeepSeek Harness sessions (this GUI). Runs any workflow; cost per model.

policy:
  sizing: deterministic (tower_ref.route) — a model never picks its own runway
  egress: filter before any cloud call (waka-cli aware/egress.py rules)
  budgets:
    deepseek_flash_coach_weekly_pool: 10% of DEEPSEEK_COACH_BUDGET_USD (opengym)
    local_cloud_ratio_target: "90/10"
