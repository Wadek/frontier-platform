# Local git hooks for the frontier-fleet monorepo.
#
# The habitat sets a global core.hooksPath (D:/wakalabs/frontier-fleet/runtime/hooks) whose
# hook files are lefthook dispatchers, so a repo only runs hooks if it ships this file.
# Without it the Frontier gate silently never runs. See scripts/frontier-gate.ps1.
#
# Doctrine: D:\wakalabs\frontier-fleet\PIPELINE.md

pre-commit:
  jobs:
    - name: frontier pre-commit (no commits on main/master)
      run: powershell -NoProfile -ExecutionPolicy Bypass -File D:/wakalabs/frontier-fleet/runtime/hooks/pre-commit.ps1

pre-push:
  jobs:
    - name: frontier gate (plan -> apply; GitHub remotes only)
      # Unconditional. Lefthook skips a job whose file list is empty, and a metadata-only
      # push produces exactly that - the gate would silently not run. The gate inspects
      # the whole tree, so hand it a list that is always non-empty.
      files: git ls-files
      use_stdin: true
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/frontier-gate.ps1
