# Local git hooks for frontier-platform.
# Note: dev and main are protected; humans merge PRs, nobody pushes those branches.
# Do not let lefthook diff against main - `git diff HEAD main` fails with exit
# 128 on this set-up and blocks push, so the pre-push job uses `files: git ls-files`.

pre-commit:
  jobs:
    - name: deny-main
      run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/deny-main.ps1

pre-push:
  jobs:
    - name: frontier-gate
      # Always non-empty so lefthook does not skip; avoid `git diff HEAD main`.
      files: git ls-files
      run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/frontier-gate.ps1 -Hook pre-push
