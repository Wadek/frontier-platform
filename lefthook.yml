# Local git hooks for frontier-platform.
# Note: default branch is frontier/public-root (no main). Do not let lefthook
# diff against main — that fails with exit 128 and blocks push.

pre-commit:
  jobs:
    - name: deny-main
      run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/deny-main.ps1

pre-push:
  jobs:
    - name: frontier-gate
      # Always non-empty so lefthook does not skip; avoid `git diff HEAD main`.
      files: git ls-files
      run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/frontier-gate.ps1 -Hook pre-push
